<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>p5 brushes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; }
    #picker {
      position: fixed; left: 14px; top: 14px; z-index: 10;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #111; background: rgba(255,255,255,0.92);
      border: 1px solid #111; padding: 6px 10px; display: flex; gap: 8px; align-items: center;
    }
    #picker select { font: inherit; }
    #hud {
      position: fixed; left: 14px; bottom: 14px; z-index: 10;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #111; background: rgba(255,255,255,0.92);
      border: 1px solid #111; padding: 10px 12px;
      pointer-events: none; user-select: none; max-width: 460px; white-space: nowrap;
    }
    #hud b { display: inline-block; min-width: 76px; }
    #hud .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    #swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #111; }
    #swatch.hidden, #hud.hidden { display: none; }
  </style>
</head>
<body>
  <div id="picker">
    <label for="brush">brush</label>
    <select id="brush"></select>
  </div>
  <div id="hud">
    <div class="row"><span id="swatch"></span><span id="status"></span></div>
    <div id="help"></div>
  </div>
  <script src="shared/hud.js"></script>
  <script src="shared/loader.js"></script>
</body>
</html>
